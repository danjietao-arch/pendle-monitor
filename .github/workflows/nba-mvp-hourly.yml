# 2026-27 NBA MVP hourly comparison.
# Does not change the Pendle monitor workflow. Schedule can be delayed or skipped.
name: nba-mvp-hourly

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: nba-mvp-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        working-directory: nba-mvp
        run: pip install -r requirements.txt

      - name: Hourly comparison
        working-directory: nba-mvp
        env:
          PYTHONPATH: src
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m nba_mvp hourly

      - name: Commit snapshots
        run: |
          git config user.name "nba-mvp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nba-mvp/data/reports
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "update nba-mvp snapshots [skip ci]"
          for i in 1 2 3; do
            git pull --rebase "origin" "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "snapshot push failed; next run can retry"
          exit 0
